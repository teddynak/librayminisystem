name: Java assignment verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Model, database and headless JavaFX tests
        run: ./mvnw -B -Pui-tests clean verify
      - name: Preserve test reports and rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assignment-test-evidence
          path: |
            target/surefire-reports/
            target/ui-evidence/
